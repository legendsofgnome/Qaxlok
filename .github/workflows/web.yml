# Builds the web version of the game in the cloud on every change and publishes it to GitHub Pages,
# so it can be played in Safari on the iPad without installing Godot anywhere.
name: Build and publish the web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.3

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Put the export templates where Godot looks for them
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
      - name: Import the project
        run: timeout 300 godot --headless --editor --quit || true
      - name: Export for the web
        run: |
          mkdir -p build/web
          ls ~/.local/share/godot/export_templates/ || true
          godot --headless --export-release "Web" build/web/index.html 2>&1 | tee export.log
          test -f build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
